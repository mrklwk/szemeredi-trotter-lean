    authors: [Mark Lewko]
    id: arXiv:2609.27023v2
    type: paper
    location: https://arxiv.org/abs/2609.27023v2
    relationship: adapts
    note: >-
      Main mathematical source. The formalization strengthens the v2 comparison
      target 3(mn)^(2/3)+2m+n+2mn/p by saving one m term using generic coordinates;
      the characteristic term is absent in characteristic zero. The subcritical
      and prime-field refinements are additional formalized statements, not
      quotations of those stronger constants from v2. Paper applications are
      excluded. A separate revised paper is not assigned an invented public URL.
  - title: Szemeredi-Trotter type theorem and sum-product estimate in finite fields
    authors: [Le Anh Vinh]
    id: arXiv:0711.4427
    type: paper
    location: https://arxiv.org/abs/0711.4427
    relationship: background
    note: >-
      Context for the finite-field estimate mn/q+sqrt(qmn). The auxiliary Lean
      theorem proves this estimate directly by finite-plane counting and a
      variance argument; it is not an imported theorem assumption.
related_formalizations: []
status:
  scope: >-
    Four complete incidence bounds for ordinary finite point and affine-line
    sets, including empty sets and characteristic two. In general the
    denominator p is the field characteristic, not the field cardinality.
    Only the prime-field theorem uses ZMod p; coefficient one on mn/p is not
    asserted for arbitrary extension fields. The subcritical hypothesis is
    inclusive: mn <= p^3. Leading coefficient 3 is not claimed optimal.
    Paper applications are outside the formalized scope.
  sorry_count: 0 # Proof development; excludes four statement-only Challenge holes.
  sorry_in_definitions: 0
