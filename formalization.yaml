fidelity:
  divergences: >-
    The line type is AffineSubspace K (K x K), with rank-one direction required
    for every member of the finite line set. Incidences are the cardinality of
    the filtered Cartesian product. The exponent is real 2/3. General bounds
    allow arbitrary fields and have linear terms m+n; the prime-field result
    has characteristic term mn/p. Generic coordinates preserve geometric
    distinctness and incidence counts. No generic-position hypothesis is
    assumed of the input configuration.
