# Release preparation from proof-only base d416282b3692a57c27baa034a0758d6abe22f3cf.
version: v0.4
project:
  name: Explicit Szemerédi–Trotter bounds over arbitrary fields
  description: >-
    We formalize four explicit Szemerédi–Trotter incidence bounds for m distinct
    points and n distinct affine lines in a field plane. In characteristic zero
    the bound is 3(mn)^(2/3) + m + n. In positive characteristic p, an arbitrary
    field admits the additional term 2mn/p. This term is absent when mn ≤ p³.
    Over the prime field ZMod p the additional term improves to mn/p without a
    size restriction. The development adapts the author's polynomial-method
    argument, uses generic coordinates for the improved linear term, and proves
    a finite-plane counting estimate for the prime-field refinement.
  authors: [Mark Lewko]
  # Palomar/licensee 10.0.0 requires this exact legacy detector spelling.
  # The approved actual grant remains AGPL-3.0-only; LICENSE is unchanged.
  license: AGPL-3.0
  responsible_maintainers: [Mark Lewko]
